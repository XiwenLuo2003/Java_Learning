server:
  port: 8080

spring:
  application:
    name: springboot-demo
  datasource:
    # 内存数据库，每次启动都会重新执行 schema.sql / data.sql
    url: jdbc:h2:mem:demo;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  sql:
    init:
      mode: always
  h2:
    console:
      enabled: true
      path: /h2-console
  main:
    # Spring Boot 2.6 起默认禁止循环依赖，这里打开只是为了演示三级缓存（lifecycle/CircularA、CircularB）
    allow-circular-references: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

demo:
  jwt:
    # HS256 要求密钥至少 32 字节
    secret: springboot-demo-jwt-secret-key-must-be-32-bytes+
    ttl-minutes: 120
  greeting:
    enabled: true
    prefix: 你好

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{traceId:-main}] %logger{20} - %msg%n"
